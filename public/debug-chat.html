    <h1>Debug Chat Data</h1>
    <div id="output"></div>
    
    <script>
        function debugChatData() {
            console.log('=== DEBUG CHAT DATA ===');
            
            // Check borrowRequests
            const borrowRequestsJSON = localStorage.getItem('borrowRequests');
            const borrowRequests = borrowRequestsJSON ? JSON.parse(borrowRequestsJSON) : [];
            
            console.log('All borrowRequests:', borrowRequests);
            console.log('Total requests:', borrowRequests.length);
            
            // Find approved requests
            const approvedRequests = borrowRequests.filter(req => req.status === 'approved');
            console.log('Approved requests:', approvedRequests);
            console.log('Approved count:', approvedRequests.length);
            
            // Check current user
            const currentUserId = 'demo-user'; // Fallback for testing
            console.log('Current user ID:', currentUserId);
            
            // Find chat eligible requests
            const eligibleRequests = approvedRequests.filter(req => 
                req.borrowerId === currentUserId || req.itemOwnerId === currentUserId
            );
            console.log('Chat eligible requests:', eligibleRequests);
            
            // Display results
            const output = document.getElementById('output');
            output.innerHTML = `
                <h3>Debug Results:</h3>
                <p><strong>Total Requests:</strong> ${borrowRequests.length}</p>
                <p><strong>Approved Requests:</strong> ${approvedRequests.length}</p>
                <p><strong>Eligible for Chat:</strong> ${eligibleRequests.length}</p>
                <p><strong>Current User:</strong> ${currentUserId}</p>
                
                <h4>Approved Requests Details:</h4>
                <pre>${JSON.stringify(approvedRequests, null, 2)}</pre>
                
                <h4>All Requests:</h4>
                <pre>${JSON.stringify(borrowRequests, null, 2)}</pre>
            `;
        }
        
        // Run debug on load
        debugChatData();
