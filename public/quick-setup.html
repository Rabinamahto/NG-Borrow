                    createdAt: new Date(Date.now() - 1200000)
                },
                {
                    id: 'msg_002',
                    text: 'hello kajal',
                    senderId: currentUserId,
                    senderName: 'Current User',
                    receiverId: 'kkumar124@navgurukul.org',
                    receiverName: 'Kajal Kumar',
                    itemName: 'Flower Poster',
                    timestamp: new Date(Date.now() - 600000).toISOString(),
                    createdAt: new Date(Date.now() - 600000)
                },
                {
                    id: 'msg_003',
                    text: 'hiii puja',
                    senderId: 'kkumar124@navgurukul.org',

                    createdAt: new Date(Date.now() - 120000)
                }
            ];

            // Save to localStorage
            localStorage.setItem('borrowRequests', JSON.stringify(borrowRequests));
            
            // Create chat conversations with proper sorted ID format
            const chatId1 = `chat_${[currentUserId, 'kkumar124@navgurukul.org'].sort().join('_')}`;
            const chatId2 = `chat_${[currentUserId, 'borrower123@example.com'].sort().join('_')}`;

            // Create chat users for immediate display
            const chatUsers = [

        function openChat() {
            window.open('/chat', '_blank');
        }

        function clearData() {
            const keys = ['borrowRequests', 'chatUsers'];
            keys.forEach(key => localStorage.removeItem(key));
            
            // Clear chat messages
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const key = localStorage.key(i);
                if (key && key.startsWith('chat_')) {
                    localStorage.removeItem(key);
                }
            }
            
            document.getElementById('status').innerHTML = 
                '<div style="background: #f8d7da; padding: 15px; border-radius: 8px; color: #721c24; margin: 10px 0;">' +
                '<i class="fa-solid fa-trash fa-app-icon"></i> All data cleared!' +
                '</div>';
        }

        // Show current data status
        function checkCurrentData() {
            const borrowRequests = localStorage.getItem('borrowRequests');
            const chatUsers = localStorage.getItem('chatUsers');
            let chatMessages = 0;
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('chat_')) {
                    chatMessages++;
                }
            }

            let status = '<h3>Current Data Status:</h3>';
            status += '<p><i class="fa-solid fa-clipboard fa-app-icon"></i> Borrow Requests: ' + (borrowRequests ? 'Present' : 'None') + '</p>';
            status += '<p><i class="fa-solid fa-users fa-app-icon"></i> Chat Users: ' + (chatUsers ? 'Present' : 'None') + '</p>';
            status += '<p><i class="fa-solid fa-comments fa-app-icon"></i> Chat Conversations: ' + chatMessages + '</p>';
            
            document.getElementById('status').innerHTML = status;
        }

        // Auto-check on load
        window.onload = checkCurrentData;
    </script>
</body>
</html>
